<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Lantern Shop</title>
    <script type="importmap">
      { "imports": { "@neocortex-link/web/ui/auto": "/vendor/neocortex/ui/auto.js" } }
    </script>
    <style>
      :root {
        --paper: #faf7f2;
        --ink: #2b2118;
        --muted: #7a6a5a;
        --line: #e8dfd2;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #15120f; --ink: #f3ece3; --muted: #a8998a; --line: #2e2721; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.55 Georgia, "Times New Roman", serif;
        background: var(--paper);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }
      main { width: min(100%, 44rem); display: grid; gap: 1.25rem; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 2rem; font-weight: normal; letter-spacing: -0.01em; }
      p { margin: 0.25rem 0 0; color: var(--muted); }
      neocortex-chat {
        height: min(34rem, 70vh);
        --nc-accent: #d97706;
        --nc-radius: 16px;
        --nc-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .shelf { font: 0.9rem system-ui, sans-serif; color: var(--muted); border-top: 1px solid var(--line); padding-top: 0.75rem; }
      .shelf strong { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>The Lantern Shop</h1>
          <p>Ask the shopkeeper anything. Turn on the speaker to hear the replies.</p>
        </div>
        <neocortex-usage-badge></neocortex-usage-badge>
      </header>

      <neocortex-chat character-id="{{CHARACTER_ID}}" heading="Shopkeeper" placeholder="Ask about the lanterns…"></neocortex-chat>

      <div class="shelf" aria-live="polite"><strong>Last action:</strong> <span id="last-action">none yet</span></div>
    </main>

    <script type="module">
      import "@neocortex-link/web/ui/auto";

      const chat = document.querySelector("neocortex-chat");
      const lastAction = document.querySelector("#last-action");

      // Whatever your character's actions are, they arrive here.
      chat.addEventListener("nc-action", (event) => {
        const { action } = event.detail;
        lastAction.textContent = action.targetId ? `${action.name} → ${action.targetId}` : action.name;
      });
    </script>
  </body>
</html>
